name: outlands-ai-example

services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a reviewed image digest}
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai_internal

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:?Set OPEN_WEBUI_IMAGE to a reviewed image digest}
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      # First owner signs up on local loopback; disable signup in Admin UI immediately.
      ENABLE_SIGNUP: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set a private WEBUI_SECRET_KEY}
    ports:
      - "127.0.0.1:${WEBUI_PORT:?Set WEBUI_PORT}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ai_internal

networks:
  ai_internal:

volumes:
  ollama_models:
  open_webui_data:
