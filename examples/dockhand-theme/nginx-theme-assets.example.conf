# DESIGN FRAGMENT ONLY: merge into a separately reviewed owner-gated server.
# Fictional URLs, no real account, tailnet, upstream or native API configuration.
# The placeholder below DENIES EVERYONE. Replace it only with an independently
# verified owner-auth subrequest. Do not remove auth_request to make assets work.
location = /_outlands_owner_check {
    internal;
    return 403;
}

# Exact no-query asset locations. Alias reads occur after access authorization.
# The directory is a read-only mount of this example's theme/ directory.
# Every new location explicitly applies GET/HEAD restrictions and its headers.
location = /__outlands/theme/netwall.css {
    if ($request_uri != "/__outlands/theme/netwall.css") { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($http_upgrade != "") { return 405; }
    if ($http_connection ~* upgrade) { return 405; }
    auth_request /_outlands_owner_check;
    alias /opt/outlands-theme/netwall.css;
    default_type text/css;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
}
location = /__outlands/theme/assets/netwall.svg {
    if ($request_uri != "/__outlands/theme/assets/netwall.svg") { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($http_upgrade != "") { return 405; }
    if ($http_connection ~* upgrade) { return 405; }
    auth_request /_outlands_owner_check;
    alias /opt/outlands-theme/assets/netwall.svg;
    default_type image/svg+xml;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
}
location = /__outlands/theme/assets/mark.svg {
    if ($request_uri != "/__outlands/theme/assets/mark.svg") { return 404; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($http_upgrade != "") { return 405; }
    if ($http_connection ~* upgrade) { return 405; }
    auth_request /_outlands_owner_check;
    alias /opt/outlands-theme/assets/mark.svg;
    default_type image/svg+xml;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
}
