# Local starter only. Review image and permissions before starting it.
services:
  homepage:
    image: ${HOMEPAGE_IMAGE:?Select a reviewed Homepage image digest in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?Set exact allowed hosts}
      PUID: ${PUID:?Set your local user ID}
      PGID: ${PGID:?Set your local group ID}
    volumes:
      - ./config:/app/config
      - ./assets:/app/public/outlands:ro
    security_opt:
      - no-new-privileges:true
