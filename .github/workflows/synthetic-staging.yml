name: Synthetic server-01 staging

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/synthetic-staging.yml'
      - 'staging/server-01/**'
      - 'modules/ai/ollama-open-webui/**'
      - 'modules/observability/synthetic-metrics/**'
      - 'modules/catalog/homepage/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/synthetic-staging.yml'
      - 'staging/server-01/**'
      - 'modules/ai/ollama-open-webui/**'
      - 'modules/observability/synthetic-metrics/**'
      - 'modules/catalog/homepage/**'

permissions:
  contents: read

jobs:
  native-staging:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Start fictional projects and check native behavior
        run: bash staging/server-01/run.sh
