name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate fictional ledger shape
        run: python3 -I -B examples/evidence-ledger/check_ledger.py examples/evidence-ledger/ledger.example.json

      - name: Run ledger contract tests
        run: python3 -I -B -m unittest discover -s examples/evidence-ledger -p 'test_*.py'

      - name: Verify fictional release fixture
        run: python3 -I -B examples/release-manifest/verify_release.py examples/release-manifest/fixtures/manifest.example.json examples/release-manifest/fixtures/export

      - name: Create and verify fictional release manifest
        run: |
          output_dir="$(mktemp -d)"
          python3 -I -B examples/release-manifest/create_manifest.py examples/release-manifest/fixtures/allowlist.example.json examples/release-manifest/fixtures/export "$output_dir/manifest.json"
          python3 -I -B examples/release-manifest/verify_release.py "$output_dir/manifest.json" examples/release-manifest/fixtures/export

      - name: Run release manifest tests
        run: python3 -I -B -m unittest discover -s examples/release-manifest -p 'test_*.py'

      - name: Screen public source
        run: python3 -I -B scripts/check_public_source.py

      - name: Test public source boundary
        run: python3 -I -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Check synthetic server-01 AI module
        run: python3 -I -B modules/ai/ollama-open-webui/check_example.py

      - name: Test server-01 AI module boundaries
        run: python3 -I -B -m unittest discover -s modules/ai/ollama-open-webui -p 'test_*.py'

      - name: Check synthetic server-01 foundation
        run: python3 -I -B modules/foundation/docker-host/check_example.py

      - name: Test server-01 foundation boundaries
        run: python3 -I -B -m unittest discover -s modules/foundation/docker-host -p 'test_*.py'

      - name: Check synthetic server-01 private entry
        run: python3 -I -B modules/access/private-entry/check_example.py

      - name: Test server-01 private entry boundaries
        run: python3 -I -B -m unittest discover -s modules/access/private-entry -p 'test_*.py'

      - name: Check synthetic server-01 observability
        run: python3 -I -B modules/observability/synthetic-metrics/check_example.py

      - name: Test server-01 observability states and boundaries
        run: python3 -I -B -m unittest discover -s modules/observability/synthetic-metrics -p 'test_*.py'

      - name: Check server-01 fictional assembly
        run: python3 -I -B hosts/server-01/check_assembly.py

      - name: Test server-01 assembly boundaries
        run: python3 -I -B -m unittest discover -s hosts/server-01 -p 'test_*.py'

      - name: Check fictional server-01 catalog
        run: python3 -I -B modules/catalog/homepage/check_example.py

      - name: Test server-01 catalog boundaries
        run: python3 -I -B -m unittest discover -s modules/catalog/homepage -p 'test_*.py'

      - name: Check Dockhand demo
        run: python3 -I -B scripts/check_dockhand_demo.py

      - name: Check app tour
        run: python3 -I -B scripts/check_app_tour.py
